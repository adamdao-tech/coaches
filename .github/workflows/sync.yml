name: Sync Streamers Clash data

on:
  schedule:
    - cron: '7,37 * * * *'   # každých 30 minut
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync.mjs
      - name: Commit changes
        run: |
          git config user.name "coaches-sync"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          # updatedAt se mění vždy – commitni jen když přibyly zápasy nebo se změnil žebříček
          if git diff --cached --quiet -I '"updatedAt"' -I '"asOf"'; then
            echo "Beze změn"; exit 0
          fi
          git commit -m "data: sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
